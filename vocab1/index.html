<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>粵語發音練習 · 高頻詞彙</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang HK","Microsoft YaHei",sans-serif;background:#eef5f3;color:#1c2b28;line-height:1.65}
  header{background:#0e7c66;color:#fff;padding:18px 20px}
  header h1{font-size:22px;font-weight:700}
  header p{font-size:13px;opacity:.92;margin-top:4px}
  .ctrl{position:sticky;top:0;z-index:10;background:#0e7c66;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.2)}
  .ctrl label{font-size:13px}
  .ctrl input[type=range]{width:140px;vertical-align:middle}
  .btn{background:#fff;color:#0e7c66;border:none;border-radius:8px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:rgba(255,255,255,.15);color:#fff}
  .tabs{display:flex;gap:8px;padding:12px 20px 0;background:#0e7c66}
  .tab{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:10px 10px 0 0;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer}
  .tab.on{background:#eef5f3;color:#0e7c66}
  .tip{background:#fff8e6;border:1px solid #ffe39a;border-radius:10px;padding:12px 14px;font-size:13px;color:#6b5400;margin:14px 14px 0}
  .tip b{color:#9a6b00}
  .wrap{max-width:780px;margin:14px auto;padding:0 14px}
  .page.hidden{display:none}
  .group{margin-bottom:26px}
  .group h2{font-size:16px;color:#0e7c66;border-left:5px solid #0e7c66;padding-left:10px;margin-bottom:12px}
  .card{background:#fff;border-radius:12px;padding:13px 15px;margin-bottom:11px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .row1{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .play{background:#0e7c66;color:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:15px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:background .15s}
  .play:active{background:#0a5d4d}
  .play.on{background:#f0a500}
  .play.ex{width:32px;height:32px;font-size:13px;background:#5b9d8e}
  .play.ex:active{background:#3f7c6e}
  .play.ex.on{background:#f0a500}
  .w{font-size:25px;font-weight:700;color:#0e7c66}
  .jp{font-size:15px;color:#5b7a73;font-family:"Courier New",monospace}
  .t{font-size:13.5px;color:#344;margin-left:auto;background:#f1f7f5;padding:2px 9px;border-radius:6px}
  .exp{margin-top:10px;padding-top:10px;border-top:1px dashed #d8e6e2}
  .exline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .exlbl{font-size:12px;color:#fff;background:#0e7c66;border-radius:5px;padding:1px 7px}
  .exyue{font-size:17px;font-weight:600;color:#244}
  .exjp{font-size:13px;color:#5b7a73;font-family:"Courier New",monospace;margin-top:4px}
  .extr{font-size:13.5px;color:#6a7b76;margin-top:2px}
</style>
</head>
<body>
<header>
  <h1>粵語發音練習 · 高頻詞彙</h1>
  <p>兩頁共 60 個日常最高頻字詞／短語（不含金融職場專詞）。每個詞有 ▶ 讀詞；例句有 ▶ 讀句。上方標籤切換兩頁。</p>
</header>
<div class="ctrl">
  <label>語速 <span id="spd">1.0</span>x</label>
  <input id="rate" type="range" min="0.5" max="1.5" step="0.1" value="1">
  <button class="btn" id="all">全部朗讀</button>
  <button class="btn ghost" id="stop">停止</button>
</div>
<div class="tabs">
  <button class="tab on" id="tab0" onclick="showPage(0)">第一頁（30 詞）</button>
  <button class="tab" id="tab1" onclick="showPage(1)">第二頁（30 詞）</button>
</div>
<div class="tip">💡 用<b>系統瀏覽器</b>（Safari / Chrome）打開才有聲；WorkBuddy 預覽面板（iframe）會靜音。語速可調到 0.7x 方便跟讀。點左側 ▶ 讀詞，點例句後 ▶ 讀句。</div>

<div class="wrap">
  <div class="page" id="page0"></div>
  <div class="page hidden" id="page1"></div>
</div>

let cur=null, rate=1, playing=false, activePage=0;
function play(key,btn){
  if(cur) cur.classList.remove("on");
  const a=new Audio(AD+key+".mp3");
  a.playbackRate=rate;
  if(btn){a.onplay=()=>{btn.classList.add("on");cur=btn;};a.onended=()=>btn.classList.remove("on");}
  a.play();
}
function stopAll(){playing=false;if(cur)cur.classList.remove("on");}

function renderPage(idx){
  const wrap=document.getElementById("page"+idx);
  wrap.innerHTML="";
  pages[idx].groups.forEach(g=>{
    const sec=document.createElement("div");sec.className="group";
    const h=document.createElement("h2");h.textContent=g.title;sec.appendChild(h);
    g.items.forEach(it=>{
      const c=document.createElement("div");c.className="card";
      c.innerHTML='<div class="row1">'+
        '<button class="play" aria-label="播放詞">▶</button>'+
        '<span class="w">'+it.w+'</span>'+
        '<span class="jp">'+it.jp+'</span>'+
        '<span class="t">'+it.t+'</span></div>'+
        '<div class="exp"><div class="exline">'+
        '<span class="exlbl">例句</span>'+
        '<span class="exyue">'+it.ex.yue+'</span>'+
        '<button class="play ex" aria-label="播放例句">▶</button></div>'+
        '<div class="exjp">'+it.ex.jp+'</div>'+
        '<div class="extr">'+it.ex.tr+'</div></div>';
      const wb=c.querySelector(".play");
      wb.onclick=()=>play(it.k,wb);
      const eb=c.querySelector(".play.ex");
      eb.onclick=()=>play(it.ex.ks,eb);
      sec.appendChild(c);
    });
    wrap.appendChild(sec);
  });
}
function showPage(idx){
  activePage=idx;
  document.getElementById("tab0").classList.toggle("on",idx===0);
  document.getElementById("tab1").classList.toggle("on",idx===1);
  document.getElementById("page0").classList.toggle("hidden",idx!==0);
  document.getElementById("page1").classList.toggle("hidden",idx!==1);
}

renderPage(0);
renderPage(1);
showPage(0);

document.getElementById("rate").oninput=(e)=>{rate=parseFloat(e.target.value);document.getElementById("spd").textContent=rate.toFixed(1);};
document.getElementById("all").onclick=()=>{
  stopAll();
  const keys=[];pages[activePage].groups.forEach(g=>g.items.forEach(it=>keys.push(it.k)));
  playing=true;let i=0;
  (function next(){
    if(!playing||i>=keys.length)return;
    const a=new Audio(AD+keys[i++]+".mp3");a.playbackRate=rate;
    a.onended=()=>setTimeout(next,250);a.play();
  })();
};
document.getElementById("stop").onclick=()=>stopAll();
</script>
</body>
</html>
